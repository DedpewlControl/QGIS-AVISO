name: Export AVISO to AeroNav GNG

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: aviso-aeronav-gng-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  convert:
    name: Convert merged AVISO GeoJSON
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout merged base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Get GeoJSON files changed by merged PR
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          gh api \
            --paginate \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename' \
            | grep '^\.exports/QGIS-geoJSON/.*\.geojson$' \
            | sort -u \
            > changed-aviso-files.txt || true

          echo "Changed AVISO GeoJSON files:"
          cat changed-aviso-files.txt || true

          if [ -s changed-aviso-files.txt ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Convert affected airports
        if: steps.changed.outputs.has_changes == 'true'
        shell: bash
        run: |
          mapfile -t FILES < changed-aviso-files.txt
          python .scripts/export_aeronav_gng.py "${FILES[@]}"

      - name: Commit generated AeroNav GNG files
        if: steps.changed.outputs.has_changes == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          if git diff --quiet -- .exports/AeroNav-GNG; then
            echo "No AeroNav GNG output changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .exports/AeroNav-GNG
          git commit -m "chore: export AVISO for AeroNav GNG (PR #${PR_NUMBER})"
          git push origin "HEAD:${{ github.event.pull_request.base.ref }}"