name: Validate AVISO GeoJSON

on:
  pull_request:
    paths:
      - ".exports/QGIS-geoJSON/**/*.geojson"

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate AVISO GeoJSON
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Find changed AVISO GeoJSON files
        id: changed
        uses: tj-actions/changed-files@v46
        with:
          files: |
            .exports/QGIS-geoJSON/**/*.geojson

      - name: Validate changed airports
        id: validate
        if: steps.changed.outputs.any_changed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          python .scripts/validate_aviso.py \
            ${{ steps.changed.outputs.all_changed_files }} \
            > aviso-report.md

      - name: Create no-change report
        if: steps.changed.outputs.any_changed != 'true'
        shell: bash
        run: |
          {
            echo "## 🗺️ AVISO Ground Layout"
            echo
            echo "No changed GeoJSON files found in \`.exports/QGIS-geoJSON/\`."
          } > aviso-report.md

      - name: Add report to workflow summary
        if: always()
        shell: bash
        run: cat aviso-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on pull request
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: aviso-validation
          path: aviso-report.md

      - name: Fail workflow if validation failed
        if: steps.validate.outcome == 'failure'
        shell: bash
        run: exit 1